name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  godot-runtime:
    needs: check
    runs-on: ubuntu-latest
    name: Godot ${{ matrix.godot-version }} runtime
    strategy:
      fail-fast: false
      matrix:
        godot-version: ["4.5.1", "4.7.2"]
    timeout-minutes: 8
    env:
      GODOT_VERSION: ${{ matrix.godot-version }}
      GODOT_DIR: /tmp/godot-${{ matrix.godot-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Godot editor
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/godot-$GODOT_VERSION.zip"
          binary="$GODOT_DIR/Godot_v$GODOT_VERSION-stable_linux.x86_64"
          mkdir -p "$GODOT_DIR"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip"
          unzip -q "$archive" -d "$GODOT_DIR"
          chmod +x "$binary"
          echo "GODOT_BIN=$binary" >> "$GITHUB_ENV"
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - name: Validate starter fixture
        timeout-minutes: 1
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=10s 45s "$GODOT_BIN" --headless --editor --path examples/starter --quit-after 2 --audio-driver Dummy
      - name: Run Godot runtime smoke
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 150s \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            node tests/godot-runtime-smoke.mjs 2>&1 | tee "$RUNNER_TEMP/godot-runtime-smoke.log"
      - name: Upload Godot runtime smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-runtime-smoke-${{ matrix.godot-version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/godot-runtime-smoke.log
          if-no-files-found: warn

  package-check:
    needs: check
    runs-on: ubuntu-latest
    name: npm package boundary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:check
      - run: npm run release:check
